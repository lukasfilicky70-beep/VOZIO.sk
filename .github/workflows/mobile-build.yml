name: VOZIO mobile builds

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - "index.html"
      - ".github/workflows/mobile-build.yml"

jobs:
  android-debug:
    name: Android debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Generate Android project
        run: npx cap add android
      - name: Sync website and plugins
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vozio-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

  ios-simulator:
    name: iOS simulator build (unsigned)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Generate iOS project
        run: npx cap add ios
      - name: Sync website and plugins
        run: npx cap sync ios
      - name: Build for simulator
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
