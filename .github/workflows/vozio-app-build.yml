name: VOZIO app build

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/vozio-app-build.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/vozio-app-build.yml'
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm install
      - run: npm run build
